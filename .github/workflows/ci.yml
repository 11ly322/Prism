name: CI

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow / numpy
        run: python -m pip install pillow numpy
      - name: Word coverage
        run: python tools/i18ncheck_app.py --strict
      - name: Plugin index
        run: python tools/make_plugin_index.py --check
      - name: Trilingual docs
        run: python tools/docscheck.py
      - name: Docs HTML
        run: python tools/make_docs_html.py --check
      - name: Version consistency
        run: python check_versions.py

  static-linux:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Plugin catalog
        run: python tools/pluginprcheck.py
      - name: Trilingual docs
        run: python tools/docscheck.py
      - name: Docs HTML
        run: python tools/make_docs_html.py --check
      - name: Version consistency
        run: python check_versions.py

  gui:
    runs-on: windows-latest
    continue-on-error: true
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow / numpy
        run: python -m pip install pillow numpy
      - name: Core UI regression
        run: python tools/runall.py --only plugincheck,marketcheck,langcheck,importcheck
