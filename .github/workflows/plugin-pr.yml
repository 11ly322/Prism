name: Plugin PR

on:
  pull_request:
    paths:
      - "plugins/index.json"
      - "plugins/*.py"
      - "docs/plugins/**"
      - "tools/pluginprcheck.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalog
        run: python tools/pluginprcheck.py
      - name: Validate README index
        run: python tools/make_plugin_index.py --check
